# Ajustes OPCIONALES de CI Seguro. Cópialo a ci/ajustes.conf y cambia lo que necesites.
# Este archivo se LEE (no se ejecuta) y solo acepta estas claves:

# Dockerfile y carpeta de construcción, si no son los de la raíz
DOCKERFILE=Dockerfile
CONTEXTO=.

# Qué nivel de vulnerabilidad bloquea (dependencias e imagen): CRITICAL o HIGH,CRITICAL
SEVERIDAD_FALLO=CRITICAL

# Etapas que este repo no necesita, separadas por espacios (ej.: "deps")
OMITIR=

# 1 = en GitHub, liberar ~20 GB de disco antes de construir (imágenes de varios GB)
LIBERAR_ESPACIO=0
